services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./001_ingest.sql:/docker-entrypoint-initdb.d/001_ingest.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:local@db/postgres
      TENANT: demo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  pgdata:
